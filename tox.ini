[tox]
envlist = py311,py312,py313,lint
skip_missing_interpreters = True
isolated_build = True

[testenv]
description = Run unit tests with pytest
extras =
deps =
    pytest>=6.0
commands =
    pytest {posargs:tests/}

[testenv:py{311,312,313}]
description = Run unit tests with pytest
deps =
    {[testenv]deps}
commands =
    pytest {posargs:tests/}

[testenv:lint]
description = Run linting checks with flake8
skip_install = True
deps =
    flake8>=4.0
    flake8-docstrings
commands =
    flake8 src/annuity/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
    flake8 src/annuity/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=79 --statistics

[testenv:coverage]
description = Run tests with coverage report
deps =
    pytest>=6.0
    pytest-cov>=3.0
commands =
    pytest --cov=annuity --cov-report=term-missing --cov-report=html {posargs:tests/}

[flake8]
max-line-length = 79
exclude = .git,__pycache__,.tox,venv,.venv,build,dist,.eggs
